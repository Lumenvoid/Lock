<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Lock</title>

<style>
body {
    margin: 0;
    font-family: -apple-system;
    background: url('https://i.imgur.com/9KX9Kxv.png') no-repeat center/cover;
background-size: cover;
    color: white;
    text-align: center;
}

.time {
    font-size: 70px;
    margin-top: 80px;
}

.date {
    font-size: 20px;
    margin-bottom: 40px;
}

.dots {
    font-size: 30px;
    letter-spacing: 10px;
}

.keypad button {
    width: 70px;
    height: 70px;
    margin: 10px;
    font-size: 25px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

</style>
</head>

<body>

<div class="time" id="time"></div>
<div class="date" id="date"></div>

<div class="dots" id="dots">⚪⚪⚪⚪</div>

<div class="keypad">
    <br>
    <button onclick="add(1)">1</button>
    <button onclick="add(2)">2</button>
    <button onclick="add(3)">3</button><br>
    <button onclick="add(4)">4</button>
    <button onclick="add(5)">5</button>
    <button onclick="add(6)">6</button><br>
    <button onclick="add(7)">7</button>
    <button onclick="add(8)">8</button>
    <button onclick="add(9)">9</button><br>
    <button onclick="reset()">⌫</button>
    <button onclick="add(0)">0</button>
</div>

<script>
let code = "";
let correct = "1234";

function updateDots() {
    document.getElementById("dots").innerText = "●".repeat(code.length) + "⚪".repeat(4-code.length);
}

function add(num) {
    if(code.length < 4){
        code += num;
        updateDots();
    }

    if(code.length === 4){
        if(code === correct){
            window.location.href = "discord://";
        } else {
            code = "";
            updateDots();
            alert("Foute code!");
        }
    }
}

function reset(){
    code = "";
    updateDots();
}

// Tijd & datum
function updateTime(){
    let now = new Date();
    document.getElementById("time").innerText =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    document.getElementById("date").innerText =
        now.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long' });
}

setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
